<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiCan</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="toolbar">
    <span id="save-dot" title="已保存"></span>
    <button id="btn-save" type="button">保存</button>
    <button id="btn-save-as" type="button">另存为</button>
    <button id="btn-open" type="button">打开</button>
    <button id="btn-reset" type="button">回 100%</button>
    <span id="zoom-value">100%</span>
    <span id="workspace-path">未打开工作文件夹</span>
    <span id="toolbar-message"></span>
  </div>
  <div id="viewport">
    <div id="grid"></div>
    <div id="hint">双击空白处新建文本节点，右键空白处新建命令节点</div>
    <div id="world">
      <svg id="edges">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3b3ac"></path>
          </marker>
          <marker id="arrow-selected" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0554a"></path>
          </marker>
        </defs>
      </svg>
      <div id="labels"></div>
      <div id="nodes"></div>
    </div>
  </div>
  <script type="module" src="/src/ui/main.mjs"></script>
</body>
</html>
