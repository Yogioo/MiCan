<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiCan</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="toolbar">
    <span id="save-dot" title="改动即落盘"></span>
    <button id="btn-save-as" type="button">另存为</button>
    <button id="btn-open" type="button">打开</button>
    <button id="btn-settings" type="button" title="命令行、超时、输出上限、界面手感 —— 跟这台机器走；运行目录跟存档走">设置</button>
    <button id="btn-evolve" type="button" title="诊断运行历史，让 pi 改这份工作文件夹，校验过了就 commit">立即进化</button>
    <button id="btn-reset" type="button">回 100%</button>
    <span id="zoom-value">100%</span>
    <span id="workspace-path">未打开工作文件夹</span>
    <span id="toolbar-message"></span>
  </div>
  <div id="viewport">
    <div id="grid"></div>
    <div id="hint">双击空白处新建文本节点，右键空白处新建命令节点<br>命令节点右侧两个点：上面拉执行边（定先后），下面拉数据边（传值）<br>左键从空白处拖出个框，框住的节点和线一起选中，Delete 一起删；平移用中键或空格 + 拖动</div>
    <div id="world">
      <svg id="edges">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3b3ac"></path>
          </marker>
          <marker id="arrow-selected" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0554a"></path>
          </marker>
          <marker id="arrow-exec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a46"></path>
          </marker>
        </defs>
      </svg>
      <div id="labels"></div>
      <div id="nodes"></div>
    </div>
    <div id="marquee" hidden></div>
    <div id="run-controls">
      <button id="btn-start" type="button" title="从入口节点出发跑完整条链路">开始</button>
      <button id="btn-stop" type="button" hidden title="把在跑的命令断掉；断到一半的输出留在节点上">停止</button>
    </div>
  </div>
  <script type="module" src="/src/ui/main.mjs"></script>
</body>
</html>
